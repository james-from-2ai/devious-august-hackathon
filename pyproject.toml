[project]
name = "hackathon-scaffold"
version = "1.0.0"
description = "Agricultural advisory service for the 2AI hackathon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "anthropic>=0.40",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pre-commit>=4.0", "pytest>=8.0"]

[tool.uv]
package = false
